<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>강몽실 공주 건강수첩 🐾</title>
<style>
  :root{
    --pink:#E86A92; --pink-soft:#FCEEF3; --purple:#7C5CC4; --purple-soft:#F2EEFB;
    --ink:#2C2330; --gray:#8A8295; --line:#EFE9F2; --bg:#FBF8FC;
    --green:#3FA66A; --amber:#E8911E; --red:#E0455A; --card:#ffffff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:78px;}
  .wrap{max-width:560px;margin:0 auto;}
  /* header / profile */
  .profile{background:linear-gradient(135deg,#E86A92,#7C5CC4);color:#fff;padding:18px 18px 20px;
    border-radius:0 0 22px 22px;box-shadow:0 6px 20px rgba(124,92,196,.25);position:relative;}
  .profile h1{margin:0;font-size:22px;display:flex;align-items:center;gap:8px;}
  .profile .sub{opacity:.92;font-size:13px;margin-top:2px;}
  .pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px;}
  .pcell{background:rgba(255,255,255,.16);border-radius:12px;padding:9px 11px;backdrop-filter:blur(4px);}
  .pcell .k{font-size:11px;opacity:.85;}
  .pcell .v{font-size:16px;font-weight:700;margin-top:1px;}
  .editbtn{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.22);border:none;color:#fff;
    width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer;}
  .alert-line{margin-top:12px;background:rgba(255,255,255,.16);border-radius:10px;padding:8px 11px;font-size:12.5px;display:none;}
  /* content */
  .content{padding:16px 16px 10px;}
  h2.sec{font-size:17px;margin:4px 0 12px;display:flex;align-items:center;gap:7px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:13px;
    box-shadow:0 2px 8px rgba(124,92,196,.05);}
  .card h3{margin:0 0 11px;font-size:15px;}
  label{display:block;font-size:12.5px;color:var(--gray);margin:9px 0 4px;font-weight:600;}
  input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;
    font-size:14px;font-family:inherit;background:#fff;color:var(--ink);}
  textarea{resize:vertical;min-height:62px;}
  .row{display:flex;gap:9px;}
  .row>div{flex:1;}
  .seg{display:flex;gap:6px;}
  .seg button{flex:1;padding:9px 0;border:1px solid var(--line);background:#fff;border-radius:9px;
    font-size:13px;cursor:pointer;color:var(--gray);font-weight:600;}
  .seg button.on{background:var(--purple);color:#fff;border-color:var(--purple);}
  .btn{background:var(--pink);color:#fff;border:none;padding:12px;border-radius:11px;font-size:15px;
    font-weight:700;width:100%;cursor:pointer;margin-top:14px;}
  .btn:active{opacity:.85;}
  .btn.sec{background:var(--purple-soft);color:var(--purple);}
  .chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .chip.g{background:#E5F5EC;color:var(--green);} .chip.a{background:#FCF1DF;color:var(--amber);}
  .chip.r{background:#FCE6E9;color:var(--red);} .chip.n{background:var(--purple-soft);color:var(--purple);}
  .li{border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:9px;background:#fff;position:relative;}
  .li .date{font-size:12px;color:var(--gray);font-weight:700;}
  .li .body{font-size:13.5px;margin-top:5px;}
  .li .del{position:absolute;top:10px;right:11px;background:none;border:none;color:#D9C9DE;font-size:18px;cursor:pointer;}
  .empty{text-align:center;color:var(--gray);font-size:13px;padding:22px 0;}
  .small{font-size:11.5px;color:var(--gray);}
  .hint{background:var(--purple-soft);border-radius:11px;padding:10px 12px;font-size:12.5px;color:#5A4A82;margin-bottom:13px;}
  /* dashboard tiles */
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-bottom:6px;}
  .tile{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;}
  .tile .t{font-size:12px;color:var(--gray);font-weight:600;}
  .tile .big{font-size:21px;font-weight:800;margin-top:3px;}
  .tile .u{font-size:12px;color:var(--gray);font-weight:600;}
  /* svg chart */
  .chartwrap{overflow-x:auto;}
  svg.chart{display:block;width:100%;height:auto;}
  /* checklist */
  .check{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .check:last-child{border-bottom:none;}
  .check input{width:20px;height:20px;flex:none;accent-color:var(--red);}
  /* tabbar */
  .tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
    display:flex;max-width:560px;margin:0 auto;z-index:50;box-shadow:0 -3px 14px rgba(124,92,196,.07);}
  .tabbar button{flex:1;border:none;background:none;padding:7px 0 6px;font-size:9.5px;color:var(--gray);
    cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;}
  .tabbar button .ic{font-size:18px;}
  .tabbar button.on{color:var(--pink);}
  .tabbar button.on .ic{transform:scale(1.12);}
  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(44,35,48,.5);display:none;align-items:flex-end;
    justify-content:center;z-index:100;}
  .modal-bg.show{display:flex;}
  .modal{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px 26px;
    max-height:88vh;overflow-y:auto;}
  .modal h3{margin:0 0 6px;}
  .danger{font-size:14px;padding:11px 13px;border-radius:11px;background:#FCE6E9;color:#A82435;
    margin-bottom:8px;display:flex;gap:9px;align-items:flex-start;}
  .danger b{display:block;}
</style>
</head>
<body>
<div class="wrap">
  <!-- PROFILE (fixed top) -->
  <div class="profile">
    <button class="editbtn" onclick="openProfile()">✏️</button>
    <h1>🐩 <span id="pName">강몽실 공주</span></h1>
    <div class="sub" id="pSub">기본 정보를 입력해 주세요</div>
    <div class="pgrid">
      <div class="pcell"><div class="k">견종</div><div class="v" id="pBreed">—</div></div>
      <div class="pcell"><div class="k">나이</div><div class="v" id="pAge">—</div></div>
      <div class="pcell"><div class="k">체중</div><div class="v" id="pWeight">—</div></div>
      <div class="pcell"><div class="k">단골 병원</div><div class="v" id="pVet">—</div></div>
    </div>
    <div class="alert-line" id="pAllergy"></div>
  </div>

  <div class="content" id="view"></div>
</div>

<!-- TABBAR -->
<div class="tabbar" id="tabbar"></div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBody"></div>
</div>

<script>
/* ---------- storage ---------- */
const KEY="mongsil_care_v1";
const blank={
  profile:{name:"강몽실 공주",breed:"",birth:"",weight:"",allergies:"",history:"",vet:"",vetPhone:"",targetKcal:""},
  lymph:[], daily:[], weight:[], bark:[], vet:[], care:[], products:[], feed:[]
};
let DB=load();
seedDefaults();
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));return r?Object.assign({},structuredClone(blank),r):structuredClone(blank);}catch(e){return structuredClone(blank);}}
// 아더마스(othermars.shop) 실제 제품 영양정보 — kcal100 = kcal/g×100 (급여기준 열량)
// 주식(플래닛)은 단백/지방이 건물(DM)기준만 공개되어 비워두고 메모에 표기, 간식은 급여기준(as-fed) 값
const ADERMAS=[
  {name:"플래닛 치킨 360g",brand:"아더마스",type:"주식",kcal100:"119.8",protein:"",fat:"",fiber:"",unit:"g",note:"30g볼×12 · 1볼≈36kcal · 닭 · DM 단백83.6/지방9.0%"},
  {name:"플래닛 포크 360g",brand:"아더마스",type:"주식",kcal100:"152.8",protein:"",fat:"",fiber:"",unit:"g",note:"30g볼×12 · 1볼≈46kcal · 돼지 · DM 단백73.7/지방19.5%"},
  {name:"플래닛 비프 360g",brand:"아더마스",type:"주식",kcal100:"135.3",protein:"",fat:"",fiber:"",unit:"g",note:"30g볼×12 · 1볼≈41kcal · 소 · DM 단백81.2/지방11.6%"},
  {name:"치킨져키 80g",brand:"아더마스",type:"간식",kcal100:"165",protein:"38.18",fat:"0.76",fiber:"0.09",unit:"g",note:"1개≈10g/16.5kcal"},
  {name:"베이크 치킨 120g",brand:"아더마스",type:"간식",kcal100:"116",protein:"25.70",fat:"0.93",fiber:"0.19",unit:"g",note:"닭가슴살 98.5%"},
  {name:"에그볼(포크&스윗펌킨)",brand:"아더마스",type:"간식",kcal100:"140",protein:"15.84",fat:"6.75",fiber:"0.40",unit:"g",note:"1개 30g/42kcal"},
  {name:"포크칩 45g",brand:"아더마스",type:"간식",kcal100:"413",protein:"65.63",fat:"15.68",fiber:"0.97",unit:"g",note:"돼지등심 74.6% · 고열량 주의"},
  {name:"치킨치즈볼",brand:"아더마스",type:"간식",kcal100:"163",protein:"24.43",fat:"6.46",fiber:"0.08",unit:"g",note:"1개 30g/48.9kcal"},
  {name:"포크치즈볼",brand:"아더마스",type:"간식",kcal100:"209",protein:"26.08",fat:"11.19",fiber:"0.13",unit:"g",note:"1개 30g/62.6kcal"},
  {name:"오리치즈볼",brand:"아더마스",type:"간식",kcal100:"171",protein:"23.22",fat:"7.86",fiber:"0.09",unit:"g",note:"1개 30g/51.1kcal"},
  {name:"올데이 덕패티 100g",brand:"아더마스",type:"간식",kcal100:"145",protein:"28.93",fat:"2.41",fiber:"0.24",unit:"g",note:"오리"},
  {name:"래빗볼",brand:"아더마스",type:"간식",kcal100:"189",protein:"23.93",fat:"10.24",fiber:"0.28",unit:"g",note:"토끼 단일단백"},
  {name:"치킨수프 180g",brand:"아더마스",type:"간식",kcal100:"63",protein:"6.77",fat:"0.72",fiber:"0.80",unit:"g",note:"수분 많은 토퍼"}
];
// 레이앤이본(rayvonne) — 화식 요리 라인 + 닥터레이 마그네타. 화식 kcal은 네이버 스토어 비공개라
// 팩 라벨('칼로리 ○kcal/1팩')을 보고 입력. 신장관리식은 재판매처 확인값(120.2kcal/100g) 사전입력.
const RAYVONNE=[
  // 주식(화식) — 주토피아프레시 공개 영양정보(급여기준, 1팩 100g)
  {name:"레이앤이본 오리고기 화식",brand:"레이앤이본",type:"주식",kcal100:"131.5",protein:"15.56",fat:"7.09",fiber:"0.72",unit:"g",note:"1팩100g/131.5kcal · 수분74%"},
  {name:"레이앤이본 소고기 화식",brand:"레이앤이본",type:"주식",kcal100:"118.2",protein:"16.48",fat:"4.90",fiber:"",unit:"g",note:"1팩100g/118.2kcal · 그래스페드"},
  {name:"레이앤이본 닭고기 신장관리식",brand:"레이앤이본",type:"주식",kcal100:"120.2",protein:"5.48",fat:"4.18",fiber:"1.64",unit:"g",note:"1팩100g/120.2kcal · 신장처방식"},
  {name:"레이앤이본 닭고기 췌장관리식",brand:"레이앤이본",type:"주식",kcal100:"82.8",protein:"8.85",fat:"0.97",fiber:"",unit:"g",note:"1팩100g/82.8kcal · 저지방 췌장처방식"},
  {name:"레이앤이본 양고기 화식",brand:"레이앤이본",type:"주식",kcal100:"109.7",protein:"16.29",fat:"4.04",fiber:"0.74",unit:"g",note:"1팩100g/109.7kcal · 그래스페드 양 · 저지방·저나트륨"},
  {name:"레이앤이본 사슴고기 화식",brand:"레이앤이본",type:"주식",kcal100:"",protein:"",fat:"",fiber:"",unit:"g",note:"제주 꽃사슴 · 팩 라벨 kcal 입력"},
  // 간식
  {name:"레이앤이본 촉촉한 닭가슴살 육포 50g",brand:"레이앤이본",type:"간식",kcal100:"245.4",protein:"56.3",fat:"2.1",fiber:"",unit:"g",note:"122.7kcal/50g · 토핑용"},
  // 영양제
  {name:"닥터레이 프로키온 유산균",brand:"레이앤이본",type:"영양제",kcal100:"",protein:"",fat:"",fiber:"",unit:"캡슐",note:"~10kg 1캡슐/일 · 유산균 300억CFU"},
  {name:"레이앤이본 바나퀸 조인트 관절영양제",brand:"레이앤이본",type:"영양제",kcal100:"",protein:"",fat:"",fiber:"",unit:"정",note:"~10kg 1~2정/일 · 글루코사민 등 10종"},
  {name:"닥터레이 마그네타",brand:"레이앤이본",type:"영양제",kcal100:"",protein:"",fat:"",fiber:"",unit:"포",note:"권장 용량은 패키지 확인"}
];
function seedDefaults(){
  if(!DB.products)DB.products=[];
  if(!DB.feed)DB.feed=[];
  // 레이앤이본 동기화 (전 라인). 구버전 placeholder/이름 정리 후 최신 카탈로그 반영
  if(DB._rayV!==3){
    const dropBlank=["레이앤이본 사료","레이앤이본 영양제","레이앤이본 화식 닭","레이앤이본 화식 오리","레이앤이본 화식 소고기","레이앤이본 화식 양고기","레이앤이본 화식 사슴고기"];
    DB.products=DB.products.filter(p=>!((dropBlank.includes(p.name)&&!p.kcal100)||p.name==="레이앤이본 신장관리식 닭고기"));
    RAYVONNE.forEach(a=>{
      const ex=DB.products.find(p=>p.name===a.name);
      if(!ex)DB.products.push({id:uid(),...a});
      else if(!ex.kcal100)Object.assign(ex,a,{id:ex.id});
    });
    DB._rayV=3;
  }
  DB._seeded=true;
  // 아더마스 실제 제품 동기화 (idempotent: 사용자가 직접 채운 값은 보존)
  if(DB._adermasV!==2){
    DB.products=DB.products.filter(p=>!(p.name==="아더마스"&&!p.kcal100)); // 과거 빈 placeholder 제거
    ADERMAS.forEach(a=>{
      const ex=DB.products.find(p=>p.name===a.name);
      if(!ex)DB.products.push({id:uid(),...a});
      else if(!ex.kcal100)Object.assign(ex,a,{id:ex.id});
    });
    DB._adermasV=2;
  }
  save();
}
function save(){localStorage.setItem(KEY,JSON.stringify(DB));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
const today=()=>new Date().toISOString().slice(0,10);

/* ---------- helpers ---------- */
function ageStr(birth){
  if(!birth)return "—";
  const b=new Date(birth),n=new Date();
  let y=n.getFullYear()-b.getFullYear();
  let m=n.getMonth()-b.getMonth();
  if(n.getDate()<b.getDate())m--;
  if(m<0){y--;m+=12;}
  if(y<=0)return m+"개월";
  return y+"세 "+m+"개월";
}
function dday(dateStr){
  if(!dateStr)return null;
  const d=new Date(dateStr+"T00:00:00"), n=new Date(today()+"T00:00:00");
  return Math.round((d-n)/86400000);
}
function ddayLabel(n){
  if(n===null)return "";
  if(n===0)return "D-DAY";
  return n>0?"D-"+n:"D+"+Math.abs(n);
}
function fmt(d){return d?d.replace(/-/g,".").slice(2):"";}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* ---------- svg line chart ---------- */
function lineChart(data,opt={}){
  // data: [{label, value}]  oldest→newest
  if(!data.length)return '<div class="empty">데이터가 쌓이면 그래프가 표시됩니다</div>';
  const W=Math.max(300,data.length*54), H=160, pad={l:34,r:14,t:16,b:26};
  const xs=W-pad.l-pad.r, ys=H-pad.t-pad.b;
  const vals=data.map(d=>d.value);
  let mn=Math.min(...vals), mx=Math.max(...vals);
  if(mn===mx){mn-=1;mx+=1;}
  const padv=(mx-mn)*0.15; mn-=padv; mx+=padv;
  const X=i=>pad.l+(data.length===1?xs/2:xs*i/(data.length-1));
  const Y=v=>pad.t+ys-ys*(v-mn)/(mx-mn);
  const col=opt.color||"#7C5CC4";
  let pts=data.map((d,i)=>X(i)+","+Y(d.value)).join(" ");
  let dots=data.map((d,i)=>`<circle cx="${X(i)}" cy="${Y(d.value)}" r="3.5" fill="${col}"/>
    <text x="${X(i)}" y="${Y(d.value)-9}" font-size="10" fill="${col}" text-anchor="middle" font-weight="700">${d.value}</text>`).join("");
  let labs=data.map((d,i)=>`<text x="${X(i)}" y="${H-8}" font-size="9" fill="#8A8295" text-anchor="middle">${d.label}</text>`).join("");
  // gridlines
  let grid="";
  for(let g=0;g<=2;g++){const v=mn+(mx-mn)*g/2;const y=Y(v);
    grid+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="#EFE9F2"/>
    <text x="4" y="${y+3}" font-size="9" fill="#B8AEC0">${(Math.round(v*10)/10)}</text>`;}
  return `<div class="chartwrap"><svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    ${grid}<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>${dots}${labs}</svg></div>`;
}

/* ---------- tabs ---------- */
const TABS=[
  {id:"home", ic:"🏠", t:"대시보드"},
  {id:"lymph",ic:"🔍", t:"림프절"},
  {id:"daily",ic:"📋", t:"컨디션"},
  {id:"feed", ic:"🍚", t:"급여"},
  {id:"weight",ic:"⚖️", t:"체중"},
  {id:"bark", ic:"🎾", t:"바크먼트"},
  {id:"vet",  ic:"🏥", t:"병원"},
  {id:"care", ic:"📅", t:"정기관리"},
  {id:"emerg",ic:"🚨", t:"응급기준"},
];
let cur="home";
function renderTabs(){
  document.getElementById("tabbar").innerHTML=TABS.map(t=>
    `<button class="${t.id===cur?'on':''}" onclick="go('${t.id}')"><span class="ic">${t.ic}</span>${t.t}</button>`).join("");
}
function go(id){cur=id;renderTabs();render();window.scrollTo(0,0);}

/* ---------- profile header ---------- */
function renderProfile(){
  const p=DB.profile;
  document.getElementById("pName").textContent=p.name||"강몽실 공주";
  document.getElementById("pSub").textContent=p.birth?("🎂 "+fmt(p.birth)+" 출생"):"기본 정보를 입력해 주세요 (✏️)";
  document.getElementById("pBreed").textContent=p.breed||"—";
  document.getElementById("pAge").textContent=ageStr(p.birth);
  const lastW=DB.weight.length?DB.weight[DB.weight.length-1].kg:p.weight;
  document.getElementById("pWeight").textContent=lastW?lastW+" kg":"—";
  document.getElementById("pVet").textContent=p.vet||"—";
  const al=document.getElementById("pAllergy");
  if(p.allergies||p.history){
    al.style.display="block";
    al.innerHTML=(p.allergies?"⚠️ 알러지: "+esc(p.allergies):"")+(p.allergies&&p.history?" · ":"")+(p.history?"📌 기왕력: "+esc(p.history):"");
  }else al.style.display="none";
}

/* ===== FEED (급여: 음식·간식·영양제·약 + 칼로리) ===== */
let feedSub="주식";
function nowTime(){return new Date().toTimeString().slice(0,5);}
function prod(id){return DB.products.find(p=>p.id===id);}
function recoKcal(){
  const w=DB.weight.length?+DB.weight[DB.weight.length-1].kg:(+DB.profile.weight||0);
  if(!w)return 0;
  return Math.round(70*Math.pow(w,0.75)); // RER(휴식대사량). 일일권장(MER)은 활동계수 1.2~1.6배
}
function setFeedSub(s){feedSub=s;render();}
function vFeed(){
  const tf=DB.feed.filter(f=>f.date===today());
  let kcalT=0,protT=0,fatT=0;
  tf.forEach(f=>{kcalT+=+f.kcal||0;protT+=+f.protein||0;fatT+=+f.fat||0;});
  const target=+DB.profile.targetKcal||0, rer=recoKcal();
  const pct=target?Math.round(kcalT/target*100):0;
  const summary=`<div class="card"><h3>📊 오늘 영양 요약 <span class="small">${fmt(today())}</span></h3>
    <div class="tiles" style="margin:0">
      <div class="tile"><div class="t">섭취 칼로리</div><div class="big">${Math.round(kcalT)}<span class="u"> kcal</span></div>
        <div class="small">${target?`목표 ${target} · ${pct}%`:(rer?`권장 약 ${rer} kcal`:'목표 미설정')}</div></div>
      <div class="tile"><div class="t">단백질 / 지방</div><div class="big" style="font-size:18px">${Math.round(protT*10)/10} / ${Math.round(fatT*10)/10}<span class="u"> g</span></div>
        <div class="small">등록된 영양값 기준</div></div>
    </div>
    ${target&&kcalT>target*1.1?'<div class="small" style="color:var(--red);margin-top:8px">⚠️ 목표 칼로리를 초과했어요</div>':''}</div>`;
  const subs=[["주식","🍚 식사"],["간식","🦴 간식"],["영양제","💊 영양제"],["약","💉 약"],["제품","⚙️ 제품"]];
  const nav=`<div class="seg" style="margin-bottom:13px">${subs.map(s=>`<button class="${feedSub===s[0]?'on':''}" onclick="setFeedSub('${s[0]}')" style="font-size:12px;padding:9px 2px">${s[1]}</button>`).join("")}</div>`;
  const body=feedSub==="제품"?feedProductPanel():feedLogPanel(feedSub);
  return `<h2 class="sec">🍚 급여 기록</h2>${summary}${nav}${body}`;
}
function feedLogPanel(type){
  const isFood=(type==="주식"||type==="간식");
  const prods=DB.products.filter(p=>p.type===type);
  const opts=`<option value="">— 제품 선택 —</option>`+prods.map(p=>`<option value="${p.id}">${esc(p.name)}${p.brand?' ('+esc(p.brand)+')':''}</option>`).join("");
  const title={"주식":"식사","간식":"간식","영양제":"영양제","약":"약"}[type];
  const list=[...DB.feed].filter(f=>f.type===type).reverse().slice(0,50).map(f=>`
    <div class="li"><button class="del" onclick="delItem('feed','${f.id}')">×</button>
    <div class="date">${fmt(f.date)} ${f.time||''}</div>
    <div class="body"><b>${esc(f.name)}</b>${f.amount?' · '+esc(f.amount)+esc(f.unit||''):''}${f.kcal?' · '+Math.round(f.kcal)+' kcal':''}
    ${f.note?'<div class="small" style="margin-top:3px">'+esc(f.note)+'</div>':''}</div></div>`).join("");
  const hint=isFood?'제품을 고르고 양(g)을 입력하면 등록된 100g당 kcal로 칼로리가 자동 계산돼요.':
    (type==="영양제"?'먹인 영양제와 용량을 시간과 함께 기록하세요.':'복용한 약·용량·시간을 기록하세요. 처방약은 🏥병원 탭과 같이 관리하면 좋아요.');
  return `<div class="hint">${hint}${prods.length?'':' <b>먼저 ⚙️제품에서 제품을 등록</b>하면 칼로리 자동계산이 됩니다.'}</div>
    <div class="card"><h3>${title} 기록</h3>
      <div class="row"><div><label>시간</label><input id="fdTime" type="time" value="${nowTime()}"></div>
        <div><label>${isFood?'양 (g)':'용량'}</label><input id="fdAmt" type="number" step="${isFood?'1':'0.5'}" inputmode="decimal" oninput="feedPrev()" placeholder="${isFood?'예: 50':'예: 1'}"></div></div>
      <label>제품</label><select id="fdProd" onchange="feedPrev()">${opts}</select>
      <label>또는 직접 입력</label><input id="fdName" placeholder="등록 안 된 음식/약 이름">
      ${isFood?'':`<label>단위</label><input id="fdUnit" value="${esc(prods[0]?prods[0].unit:'정')}" placeholder="정 / 포 / ml">`}
      ${isFood?`<label>kcal 직접 입력 (제품 미선택 시)</label><input id="fdKcal" type="number" inputmode="decimal" oninput="feedPrev()" placeholder="선택">`:''}
      <label>메모</label><input id="fdNote" placeholder="${isFood?'예: 잘 먹음 / 남김':'예: 식후 / 처방'}">
      ${isFood?`<div class="small" id="fdPrev" style="margin-top:8px;text-align:center;color:var(--purple);font-weight:700">예상 칼로리: — kcal</div>`:''}
      <button class="btn" onclick="addFeed('${type}')">＋ 기록 저장</button>
    </div>
    ${list||'<div class="empty">기록이 없습니다</div>'}`;
}
function feedPrev(){
  const el=document.getElementById("fdPrev");if(!el)return;
  const amt=+(val("fdAmt")||0);
  const sel=document.getElementById("fdProd");
  const p=sel&&sel.value?prod(sel.value):null;
  let k=0,warn="";
  if(p&&p.kcal100&&amt)k=+p.kcal100*amt/100;
  else if(p&&!p.kcal100)warn=" (제품에 100g당 kcal 미입력)";
  const mk=+(val("fdKcal")||0);if(!k&&mk)k=mk;
  el.textContent="예상 칼로리: "+(k?Math.round(k):"—")+" kcal"+warn;
}
function addFeed(type){
  const isFood=(type==="주식"||type==="간식");
  const amt=val("fdAmt");
  const sel=document.getElementById("fdProd");
  const p=sel&&sel.value?prod(sel.value):null;
  const freeName=val("fdName");
  if(!p&&!freeName){alert("제품을 선택하거나 이름을 직접 입력해 주세요");return;}
  if(isFood&&!amt){alert("양(g)을 입력해 주세요");return;}
  const name=p?p.name:freeName;
  const unit=isFood?'g':(val("fdUnit")||'');
  let kcal=0,protein=0,fat=0;
  if(p&&p.kcal100&&amt)kcal=+p.kcal100*(+amt)/100;
  const mk=val("fdKcal");if(!kcal&&mk)kcal=+mk;
  if(p&&p.protein&&amt)protein=+p.protein*(+amt)/100;
  if(p&&p.fat&&amt)fat=+p.fat*(+amt)/100;
  DB.feed.push({id:uid(),date:today(),time:val("fdTime"),type,productId:p?p.id:"",name,amount:amt,unit,kcal,protein,fat,note:val("fdNote")});
  DB.feed.sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")));
  save();render();
}
function feedProductPanel(){
  const byType={};DB.products.forEach(p=>{(byType[p.type]=byType[p.type]||[]).push(p);});
  const order=["주식","간식","영양제","약"];
  const lists=order.filter(t=>byType[t]).map(t=>`<div class="card"><h3>${t}</h3>`+byType[t].map(p=>`
      <div class="li"><button class="del" onclick="delItem('products','${p.id}')">×</button>
      <div class="body"><b>${esc(p.name)}</b>${p.brand?' <span class="small">· '+esc(p.brand)+'</span>':''}
      <div class="small" style="margin-top:3px">${p.kcal100?`🔥 100g당 ${p.kcal100} kcal`:'🔥 kcal 미입력'}${p.protein?` · 단백 ${p.protein}%`:''}${p.fat?` · 지방 ${p.fat}%`:''}${p.unit&&p.unit!=='g'?` · 단위 ${esc(p.unit)}`:''}</div>
      ${p.note?'<div class="small">'+esc(p.note)+'</div>':''}
      <button class="btn sec" onclick="editProduct('${p.id}')" style="margin-top:8px;padding:7px">영양정보 수정</button></div></div>`).join("")+`</div>`).join("");
  return `<div class="hint"><b>아더마스(othermars.shop) 주식·간식 13종은 공식 영양정보(kcal)가 이미 입력</b>돼 있어요 — 급여 탭에서 제품 고르고 g만 넣으면 자동 계산됩니다. 레이앤이본 등 다른 제품은 라벨의 100g당 kcal를 직접 입력해 주세요.</div>
    ${lists}
    <div class="card"><h3>＋ 제품 추가</h3>
      <label>이름</label><input id="prName" placeholder="예: 아더마스">
      <div class="row"><div><label>브랜드</label><input id="prBrand" placeholder="예: 레이앤이본"></div>
        <div><label>종류</label><select id="prType"><option>주식</option><option>간식</option><option>영양제</option><option>약</option></select></div></div>
      <div class="row"><div><label>100g당 kcal</label><input id="prKcal" type="number" inputmode="decimal" placeholder="라벨 참고"></div>
        <div><label>단위</label><input id="prUnit" value="g" placeholder="g / 정 / ml"></div></div>
      <div class="row"><div><label>단백질 %</label><input id="prProt" type="number" inputmode="decimal"></div>
        <div><label>지방 %</label><input id="prFat" type="number" inputmode="decimal"></div>
        <div><label>식이섬유 %</label><input id="prFiber" type="number" inputmode="decimal"></div></div>
      <label>메모</label><input id="prNote" placeholder="선택">
      <button class="btn" onclick="addProduct()">＋ 등록</button>
    </div>`;
}
function addProduct(){
  const name=val("prName");if(!name){alert("이름을 입력해 주세요");return;}
  DB.products.push({id:uid(),name,brand:val("prBrand"),type:document.getElementById("prType").value,
    kcal100:val("prKcal"),unit:val("prUnit")||'g',protein:val("prProt"),fat:val("prFat"),fiber:val("prFiber"),note:val("prNote")});
  save();render();
}
function editProduct(id){
  const p=prod(id);if(!p)return;
  document.getElementById("modalBody").innerHTML=`
    <h3>⚙️ 제품 수정</h3>
    <label>이름</label><input id="epName" value="${esc(p.name)}">
    <div class="row"><div><label>브랜드</label><input id="epBrand" value="${esc(p.brand||'')}"></div>
      <div><label>종류</label><select id="epType">${["주식","간식","영양제","약"].map(t=>`<option ${p.type===t?'selected':''}>${t}</option>`).join("")}</select></div></div>
    <div class="row"><div><label>100g당 kcal</label><input id="epKcal" type="number" value="${esc(p.kcal100||'')}"></div>
      <div><label>단위</label><input id="epUnit" value="${esc(p.unit||'g')}"></div></div>
    <div class="row"><div><label>단백질 %</label><input id="epProt" type="number" value="${esc(p.protein||'')}"></div>
      <div><label>지방 %</label><input id="epFat" type="number" value="${esc(p.fat||'')}"></div>
      <div><label>식이섬유 %</label><input id="epFiber" type="number" value="${esc(p.fiber||'')}"></div></div>
    <label>메모</label><input id="epNote" value="${esc(p.note||'')}">
    <button class="btn" onclick="saveProduct('${id}')">저장</button>
    <button class="btn sec" onclick="closeModal()">취소</button>`;
  document.getElementById("modalBg").classList.add("show");
}
function saveProduct(id){
  const p=prod(id);if(!p)return;
  Object.assign(p,{name:val("epName")||p.name,brand:val("epBrand"),type:document.getElementById("epType").value,
    kcal100:val("epKcal"),unit:val("epUnit")||'g',protein:val("epProt"),fat:val("epFat"),fiber:val("epFiber"),note:val("epNote")});
  save();closeModal();render();
}

/* ===== WEIGHT ===== */
function vWeight(){
  const data=DB.weight.slice(-12).map(x=>({label:fmt(x.date),value:+x.kg}));
  const list=[...DB.weight].reverse().map((x,i,arr)=>{
    return `<div class="li"><button class="del" onclick="delItem('weight','${x.id}')">×</button>
      <div class="date">${fmt(x.date)}</div><div class="body"><b style="font-size:16px">${x.kg} kg</b>${x.note?' · '+esc(x.note):''}</div></div>`;
  }).join("");
  return `
    <h2 class="sec">⚖️ 체중 기록</h2>
    <div class="card"><h3>추이 그래프</h3>${lineChart(data,{color:'#7C5CC4'})}</div>
    <div class="card"><h3>새 기록</h3>
      <div class="row"><div><label>날짜</label><input id="wDate" type="date" value="${today()}"></div>
      <div><label>체중 (kg)</label><input id="wKg" type="number" step="0.01" inputmode="decimal" placeholder="예: 4.20"></div></div>
      <label>메모</label><input id="wNote" placeholder="예: 식후 측정">
      <button class="btn" onclick="addWeight()">＋ 저장</button>
    </div>
    ${list||'<div class="empty">아직 체중 기록이 없습니다</div>'}
  `;
}
function addWeight(){
  const kg=document.getElementById("wKg").value, d=document.getElementById("wDate").value;
  if(!kg){alert("체중을 입력해 주세요");return;}
  DB.weight=DB.weight.filter(x=>x.date!==d);
  DB.weight.push({id:uid(),date:d,kg:(+kg).toString(),note:document.getElementById("wNote").value});
  DB.weight.sort((a,b)=>a.date.localeCompare(b.date));
  save();render();
}

/* ===== BARK (바크먼트) ===== */
function vBark(){
  const list=[...DB.bark].reverse().map(x=>`<div class="li"><button class="del" onclick="delItem('bark','${x.id}')">×</button>
    <div class="date">${fmt(x.date)}${x.cond?' · <span class="chip n">'+esc(x.cond)+'</span>':''}</div>
    <div class="body">${esc(x.content).replace(/\n/g,'<br>')}</div></div>`).join("");
  return `
    <h2 class="sec">🎾 바크먼트 세션</h2>
    <div class="card"><h3>세션 기록</h3>
      <label>날짜</label><input id="bDate" type="date" value="${today()}">
      <label>운동 내용</label><textarea id="bContent" placeholder="예: 노즈워크 20분 + 터그놀이 / 합정 실내 / 계단 오르기 5세트"></textarea>
      <label>컨디션 메모</label><input id="bCond" placeholder="예: 후반 지침 / 매우 활발">
      <button class="btn" onclick="addBark()">＋ 세션 저장</button>
    </div>
    ${list||'<div class="empty">첫 바크먼트 세션을 기록해 보세요 🎾</div>'}
  `;
}
function addBark(){
  const c=document.getElementById("bContent").value;
  if(!c){alert("운동 내용을 입력해 주세요");return;}
  DB.bark.push({id:uid(),date:document.getElementById("bDate").value,content:c,cond:document.getElementById("bCond").value});
  DB.bark.sort((a,b)=>a.date.localeCompare(b.date));
  save();render();
}

/* ===== VET ===== */
function vVet(){
  const list=[...DB.vet].reverse().map(x=>{
    const d=dday(x.next);
    return `<div class="li"><button class="del" onclick="delItem('vet','${x.id}')">×</button>
      <div class="date">${fmt(x.date)} · ${esc(x.hospital||'')}</div>
      <div class="body">${esc(x.content).replace(/\n/g,'<br>')}
      ${x.rx?'<div style="margin-top:5px">💊 '+esc(x.rx)+'</div>':''}
      ${x.next?`<div style="margin-top:7px">📌 다음 방문 ${fmt(x.next)} <span class="chip ${d<0?'r':d<=7?'a':'n'}">${ddayLabel(d)}</span></div>`:''}</div></div>`;
  }).join("");
  return `
    <h2 class="sec">🏥 병원 방문 기록</h2>
    <div class="card"><h3>방문 기록</h3>
      <div class="row"><div><label>날짜</label><input id="vDate" type="date" value="${today()}"></div>
      <div><label>병원</label><input id="vHosp" placeholder="병원명" value="${esc(DB.profile.vet||'')}"></div></div>
      <label>진료 내용 / 진단</label><textarea id="vContent" placeholder="예: 하악 림프절 촉진, 초음파 / 양성 소견"></textarea>
      <label>처방</label><input id="vRx" placeholder="예: 항생제 7일분">
      <label>다음 방문일</label><input id="vNext" type="date">
      <button class="btn" onclick="addVet()">＋ 저장</button>
    </div>
    ${list||'<div class="empty">병원 방문 기록이 없습니다</div>'}
  `;
}
function addVet(){
  const c=document.getElementById("vContent").value;
  if(!c){alert("진료 내용을 입력해 주세요");return;}
  DB.vet.push({id:uid(),date:document.getElementById("vDate").value,hospital:document.getElementById("vHosp").value,
    content:c,rx:document.getElementById("vRx").value,next:document.getElementById("vNext").value});
  DB.vet.sort((a,b)=>a.date.localeCompare(b.date));
  save();render();
}

/* ===== CARE (정기 관리) ===== */
const CARE_PRESETS=["종합 예방접종","광견병","심장사상충 약","켄넬코프","치과 스케일링","미용","구충(내부)","발톱·항문낭"];
function vCare(){
  const list=DB.care.map(c=>({...c,d:dday(c.nextDate)})).sort((a,b)=>{
    if(a.d===null)return 1; if(b.d===null)return -1; return a.d-b.d;});
  const cards=list.map(c=>{
    const cl=c.d===null?'n':c.d<0?'r':c.d<=14?'a':'n';
    const note=c.d===null?'예정일 미정':c.d<0?Math.abs(c.d)+'일 경과':c.d===0?'오늘!':c.d+'일 남음';
    return `<div class="li"><button class="del" onclick="delItem('care','${c.id}')">×</button>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><b>${esc(c.type)}</b><div class="small">${c.lastDate?'최근 '+fmt(c.lastDate)+' · ':''}${c.cycle?c.cycle+'일 주기':''}</div></div>
        <div style="text-align:right"><span class="chip ${cl}">${ddayLabel(c.d)}</span><div class="small">${c.nextDate?fmt(c.nextDate):''} · ${note}</div></div>
      </div></div>`;
  }).join("");
  return `
    <h2 class="sec">📅 정기 관리</h2>
    <div class="hint">🟧 14일 이내 임박은 <b>주황</b>, 지난 일정은 <b>빨강</b>으로 표시됩니다. 접종·약 투여 후 다음 예정일을 갱신해 주세요.</div>
    <div class="card"><h3>일정 추가</h3>
      <label>항목</label>
      <select id="cType">${CARE_PRESETS.map(p=>`<option>${p}</option>`).join("")}<option value="__custom">+ 직접 입력</option></select>
      <input id="cCustom" placeholder="직접 입력" style="display:none;margin-top:7px">
      <div class="row"><div><label>최근 시행일</label><input id="cLast" type="date"></div>
      <div><label>주기(일, 선택)</label><input id="cCycle" type="number" inputmode="numeric" placeholder="예: 365"></div></div>
      <label>다음 예정일</label><input id="cNext" type="date">
      <div class="small" style="margin-top:4px">최근일+주기를 입력하면 예정일이 자동 계산됩니다(직접 지정도 가능)</div>
      <button class="btn" onclick="addCare()">＋ 추가</button>
    </div>
    ${cards||'<div class="empty">예방접종·심장사상충·스케일링·미용 등을 등록하세요</div>'}
  `;
}
function addCare(){
  const sel=document.getElementById("cType");
  let type=sel.value==="__custom"?document.getElementById("cCustom").value.trim():sel.value;
  if(!type){alert("항목을 입력해 주세요");return;}
  const last=document.getElementById("cLast").value, cycle=document.getElementById("cCycle").value;
  let next=document.getElementById("cNext").value;
  if(!next&&last&&cycle){const d=new Date(last+"T00:00:00");d.setDate(d.getDate()+(+cycle));next=d.toISOString().slice(0,10);}
  DB.care.push({id:uid(),type,lastDate:last,cycle,nextDate:next});
  save();render();
}

/* ===== EMERGENCY ===== */
const EMERG=[
 "10~15분 이상 멈추지 않는 구토 / 반복 구토",
 "혈변·흑색변 또는 멈추지 않는 설사",
 "호흡 곤란, 잇몸·혀가 파랗거나 창백함",
 "쓰러짐·발작·의식 저하",
 "복부가 갑자기 부풀고 헛구역질 (위염전 의심)",
 "체온 39.5℃ 이상 또는 37℃ 이하",
 "24시간 이상 아무것도 먹지 않음 / 물도 거부",
 "소변을 못 보거나 배뇨 시 심한 통증",
 "심한 무기력, 일어서지 못함",
 "외상·출혈이 멈추지 않음",
];
const EMERG_LYMPH=[
 "림프절이 단기간(수일~2주)에 눈에 띄게 커짐",
 "좌우 여러 부위(턱밑·겨드랑·사타구니) 동시에 커짐",
 "단단하고 고정되어 잘 움직이지 않음",
 "발열·식욕저하·체중감소·무기력 동반",
];
function vEmerg(){
  const p=DB.profile;
  return `
    <h2 class="sec">🚨 응급 판단 기준 <span class="small">(참고용)</span></h2>
    <div class="card" style="border-color:#F6C9D1">
      <h3 style="color:var(--red)">⛔ 즉시 병원에 가야 하는 증상</h3>
      ${EMERG.map((e,i)=>`<div class="check"><input type="checkbox" id="em${i}"><label for="em${i}" style="margin:0;color:var(--ink);font-weight:500">${e}</label></div>`).join("")}
    </div>
    <div class="card" style="border-color:#E6D9F2">
      <h3 style="color:var(--purple)">🔍 림프절 관련 — 진료 권장 신호</h3>
      ${EMERG_LYMPH.map((e,i)=>`<div class="check"><input type="checkbox" id="el${i}"><label for="el${i}" style="margin:0;color:var(--ink);font-weight:500">${e}</label></div>`).join("")}
    </div>
    <div class="card" style="background:var(--pink-soft);border-color:#F6C9D1">
      <h3>📇 몽실 공주 응급 정보 카드</h3>
      <div class="small" style="line-height:1.9">
        🐩 이름: <b>${esc(p.name||'강몽실 공주')}</b><br>
        🐾 견종: <b>${esc(p.breed||'—')}</b> · 나이 <b>${ageStr(p.birth)}</b><br>
        ⚖️ 체중: <b>${DB.weight.length?DB.weight[DB.weight.length-1].kg+' kg':(p.weight?p.weight+' kg':'—')}</b><br>
        ⚠️ 알러지: <b>${esc(p.allergies||'—')}</b><br>
        📌 기왕력: <b>${esc(p.history||'—')}</b><br>
        🏥 단골 병원: <b>${esc(p.vet||'—')}</b> ${p.vetPhone?'<a href="tel:'+esc(p.vetPhone)+'">📞 '+esc(p.vetPhone)+'</a>':''}
      </div>
      <button class="btn sec" onclick="openProfile()" style="margin-top:12px">정보 수정하기</button>
    </div>
    <div class="small" style="text-align:center;padding:6px 0 4px">※ 본 체크리스트는 참고용이며 진단을 대체하지 않습니다. 의심되면 수의사와 상담하세요.</div>
  `;
}

/* ===== shared delete ===== */
function delItem(coll,id){
  if(!confirm("이 기록을 삭제할까요?"))return;
  DB[coll]=DB[coll].filter(x=>x.id!==id);save();render();
}

/* ===== profile modal ===== */
function openProfile(){
  const p=DB.profile;
  document.getElementById("modalBody").innerHTML=`
    <h3>✏️ 몽실 공주 기본 정보</h3>
    <label>이름</label><input id="mName" value="${esc(p.name)}">
    <label>견종</label><input id="mBreed" value="${esc(p.breed)}" placeholder="예: 토이푸들">
    <label>생년월일</label><input id="mBirth" type="date" value="${esc(p.birth)}">
    <label>현재 체중 (kg)</label><input id="mWeight" type="number" step="0.01" inputmode="decimal" value="${esc(p.weight)}" placeholder="예: 4.2">
    <label>알러지</label><input id="mAllergy" value="${esc(p.allergies)}" placeholder="예: 닭고기, 특정 약물">
    <label>기왕력 / 특이사항</label><textarea id="mHistory" placeholder="예: 슬개골 탈구 1기, 과거 외이염">${esc(p.history)}</textarea>
    <label>단골 병원</label><input id="mVet" value="${esc(p.vet)}" placeholder="예: VIP 동물병원">
    <label>병원 연락처</label><input id="mVetPhone" type="tel" value="${esc(p.vetPhone)}" placeholder="예: 032-000-0000">
    <label>하루 목표 칼로리 (kcal, 선택)</label><input id="mTargetKcal" type="number" inputmode="decimal" value="${esc(p.targetKcal||'')}" placeholder="비우면 권장량 안내">
    <div class="small">체중 기반 휴식대사량(RER) 약 <b>${recoKcal()||'—'} kcal</b> · 일일권장(MER)은 활동량에 따라 1.2~1.6배예요</div>
    <button class="btn" onclick="saveProfile()">저장</button>
    <button class="btn sec" onclick="closeModal()">취소</button>
    <div style="border-top:1px solid var(--line);margin:18px 0 0;padding-top:14px">
      <button class="btn sec" onclick="exportData()" style="margin-top:0">⬇️ 데이터 백업(JSON 내보내기)</button>
      <label style="text-align:center;display:block">⬆️ 백업 파일 불러오기</label>
      <input type="file" accept="application/json" onchange="importData(event)">
    </div>`;
  document.getElementById("modalBg").classList.add("show");
}
function closeModal(){document.getElementById("modalBg").classList.remove("show");}
function saveProfile(){
  DB.profile={name:val("mName")||"강몽실 공주",breed:val("mBreed"),birth:val("mBirth"),weight:val("mWeight"),
    allergies:val("mAllergy"),history:val("mHistory"),vet:val("mVet"),vetPhone:val("mVetPhone"),targetKcal:val("mTargetKcal")};
  // 프로필 체중을 체중 기록에도 반영(같은 날 갱신)
  if(DB.profile.weight){
    DB.weight=DB.weight.filter(x=>x.date!==today());
    DB.weight.push({id:uid(),date:today(),kg:(+DB.profile.weight).toString(),note:"기본정보 입력"});
    DB.weight.sort((a,b)=>a.date.localeCompare(b.date));
  }
  save();closeModal();render();
}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():"";};

/* ===== backup ===== */
function exportData(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="mongsil_backup_"+today()+".json";a.click();
}
function importData(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{try{DB=Object.assign({},blank,JSON.parse(e.target.result));save();closeModal();render();alert("불러오기 완료 🐾");}catch(err){alert("올바른 백업 파일이 아닙니다");}};
  r.readAsText(f);
}

/* ===== init ===== */
renderTabs();render();
</script>
